<style>

  /* ===== Themes: colour tokens (R G B triplets) ===== */
  :root { --accent:255 186 222; --on-accent:0 0 0; --bg:10 10 10; --panel:18 18 18; --card:30 30 30; --card2:40 40 40; --fg:232 232 232; --g300:209 213 219; --g400:156 163 175; --g500:107 114 128; --line:255 255 255; --l5:.05; --l10:.1; color-scheme: dark; }
  html[data-theme="ocean"]  { --accent:96 165 250;  --bg:10 13 20; --panel:16 21 31; --card:26 33 48; --card2:36 45 64; }
  html[data-theme="mint"]   { --accent:52 211 153;  --bg:9 16 13;  --panel:15 25 21; --card:24 38 32; --card2:33 51 44; }
  html[data-theme="sunset"] { --accent:251 146 60;  --bg:16 11 8;  --panel:26 19 14; --card:40 30 22; --card2:54 41 30; }
  html[data-theme="violet"] { --accent:167 139 250; --bg:13 10 20; --panel:21 17 31; --card:33 27 48; --card2:45 38 66; }
  html[data-theme="amoled"] { --accent:34 211 238;  --bg:0 0 0;    --panel:8 8 8;    --card:22 22 22; --card2:34 34 34; }
  html[data-theme="light"]  { --accent:219 39 119; --on-accent:255 255 255; --bg:247 247 250; --panel:255 255 255; --card:235 235 241; --card2:220 220 230; --fg:17 24 39; --g300:75 85 99; --g400:100 107 120; --g500:120 128 142; --line:0 0 0; --l5:.08; --l10:.14; color-scheme: light; }

  /* the compiled stylesheet is static, so re-point its colour utilities at the tokens */
  .bg-accent { background-color: rgb(var(--accent) / var(--tw-bg-opacity,1)); }
  .hover\:bg-accent:hover { background-color: rgb(var(--accent)); }
  .text-accent { color: rgb(var(--accent)); }
  .hover\:text-accent:hover { color: rgb(var(--accent)); }
  .border-accent { border-color: rgb(var(--accent)); }
  .hover\:border-accent:hover { border-color: rgb(var(--accent)); }
  .focus-within\:border-accent:focus-within { border-color: rgb(var(--accent)); }
  .group:hover .group-hover\:text-accent { color: rgb(var(--accent)); }
  .text-black { color: rgb(var(--on-accent)); }
  .hover\:text-black:hover { color: rgb(var(--on-accent)); }
  .bg-card { background-color: rgb(var(--card)); }
  .bg-card\/80 { background-color: rgb(var(--card) / .8); }
  .bg-panel { background-color: rgb(var(--panel)); }
  .bg-panel\/95 { background-color: rgb(var(--panel) / .95); }
  .bg-white\/40 { background-color: rgb(var(--line) / .35); }
  .border-white\/5 { border-color: rgb(var(--line) / var(--l5)); }
  .border-white\/10 { border-color: rgb(var(--line) / var(--l10)); }
  .text-gray-300 { color: rgb(var(--g300)); }
  .text-gray-400 { color: rgb(var(--g400)); }
  .text-gray-500 { color: rgb(var(--g500)); }
  .placeholder-gray-500::placeholder { color: rgb(var(--g500)); }
  .placeholder-gray-500::-moz-placeholder { color: rgb(var(--g500)); }
  .from-bg { --tw-gradient-from: rgb(var(--bg)) var(--tw-gradient-from-position); --tw-gradient-to: rgb(var(--bg) / 0) var(--tw-gradient-to-position); }

  /* theme picker */

function playAniKotoEpisode(index) {

  const embedId = ep.episode_embed_id || ep.embed_id || ep.player_id || ep.id;
  let src = '';
  if (typeof embed === 'string' && /^https:\/\//i.test(embed)) src = embed;

    label.textContent = `Episode ${index + 1} · No player URL or episode_embed_id was returned.`;

}

  if (state.view === 'search') return { ...v, search: state.query, sort: [state.sortBy || 'SEARCH_MATCH'] };
  if (state.filter === 'movies') return { ...v, format: state.formatFilter || 'MOVIE', minPop: 1000 };

}

const REL_Q = `query($id:Int){Media(id:$id,type:ANIME){id title{romaji english} format seasonYear startDate{year} episodes relations{edges{relationType node{id type format}}}}}`;
const SEASON_FORMATS = ['TV', 'TV_SHORT', 'ONA', 'MOVIE', 'OVA'];
const seasonCache = new Map();
async function getSeasonChain(id) {
  const key = String(id);
  if (seasonCache.has(key)) return seasonCache.get(key);
  const fetchOne = async (i) => (await gql(REL_Q, { id: +i })).Media;
  const self = await fetchOne(id);
  const walk = async (start, type, max) => {
    const out = []; let cur = start;
    for (let n = 0; n < max; n++) {
      const edge = (cur.relations?.edges || []).find(e => e.relationType === type && e.node.type === 'ANIME' && e.node.format === self.format);
      if (!edge) break;
      try { cur = await fetchOne(edge.node.id); } catch (_) { break; }
      out.push(cur);
    }
    return out;
  };
  const [back, fwd] = await Promise.all([walk(self, 'PREQUEL', 5), walk(self, 'SEQUEL', 5)]);
  const chain = [...back.reverse(), self, ...fwd];
  seasonCache.set(key, chain);
  return chain;
}
async function loadSeasons(id) {
  try {
    const chain = await getSeasonChain(id);
    const wrap = $('#seasonWrap'), bar = $('#seasonBar');
    if (!wrap || !bar || state.view !== 'watch' || String(state.id) !== String(id) || chain.length < 2) return;
    let n = 0;
    bar.innerHTML = chain.map(m => {
      const isSeason = ['TV', 'TV_SHORT', 'ONA'].includes(m.format);
      const label = isSeason ? 'Season ' + (++n) : (FORMATS[m.format] || m.format) + (m.seasonYear || m.startDate?.year ? ' ' + (m.seasonYear || m.startDate.year) : '');
      const on = String(m.id) === String(id);
      const title = esc(m.title.english || m.title.romaji);
      return `<button data-season="${m.id}" title="${title}" class="px-3 py-1.5 rounded-full text-xs border border-white/5 ${on ? 'bg-accent text-black' : 'bg-card hover:bg-accent hover:text-black'}">${esc(label)}</button>`;
    }).join('');
    wrap.classList.remove('hidden');
  } catch (_) { /* season switcher is optional */ }
}

const RS_Q = `query($id:Int){Media(id:$id,type:ANIME){
  relations{edges{relationType node{${MEDIA_LITE} type}}}
  recommendations(sort:RATING_DESC,perPage:20){nodes{mediaRecommendation{${MEDIA_LITE} type}}}}}`;
const REL_ORDER = ['PARENT', 'PREQUEL', 'SEQUEL', 'SIDE_STORY', 'SPIN_OFF', 'ALTERNATIVE', 'SUMMARY', 'CHARACTER', 'OTHER'];
const relLabel = (t) => t.charAt(0) + t.slice(1).toLowerCase().replace(/_/g, ' ');
const rsCache = new Map();
function miniCard(m, tag) {
  const a = norm(m);
  return `<a href="#" data-watch="${a.mal_id}" class="mini-card group" title="${esc(a.title)}">
    <div class="pic"><img src="${esc(img(a))}" alt="${esc(a.title)}" loading="lazy">${a.score ? `<span class="sc">★ ${a.score}</span>` : ''}${a.unreleased ? `<span class="tag">${esc(comingInfo(a).text)}</span>` : tag ? `<span class="tag">${esc(tag)}</span>` : ''}</div>
    <h3 class="group-hover:text-accent transition-colors">${esc(a.title)}</h3></a>`;

async function loadRelatedSimilar(id) {
  try {
    let data = rsCache.get(String(id));
    if (!data) { data = (await gql(RS_Q, { id: +id })).Media; rsCache.set(String(id), data); }
    if (state.view !== 'watch' || String(state.id) !== String(id)) return;
    const rel = (data.relations?.edges || [])
      .filter(e => e.node?.type === 'ANIME')
      .sort((x, y) => (REL_ORDER.indexOf(x.relationType) + 99) % 99 - (REL_ORDER.indexOf(y.relationType) + 99) % 99);
    const seen = new Set([String(id)]);
    const relIds = new Set(rel.map(e => String(e.node.id)));
    const sim = (data.recommendations?.nodes || []).map(n => n.mediaRecommendation)
      .filter(m => m && m.type === 'ANIME' && !relIds.has(String(m.id)) && !seen.has(String(m.id)) && seen.add(String(m.id)));
    const fill = (wrap, row, html) => { const w = $(wrap), r = $(row); if (!w || !r || !html) return; r.innerHTML = html; w.classList.remove('hidden'); };
    fill('#relatedWrap', '#relatedRow', rel.map(e => miniCard(e.node, relLabel(e.relationType))).join(''));
    fill('#similarWrap', '#similarRow', sim.map(m => miniCard(m, '')).join(''));
  } catch (_) { /* optional sections */ }
}

        <div id="relatedWrap" class="hidden mt-6"><h2 class="font-bold mb-3">Related</h2><div id="relatedRow" class="mini-row"></div></div>
        <div id="similarWrap" class="hidden mt-6"><h2 class="font-bold mb-3">Similar</h2><div id="similarRow" class="mini-row"></div></div>
      </aside>
    </div>`;
    playEpisode(trailer && canEmbed && !state.startEpisode ? 0 : Math.max(1, Number(state.startEpisode) || 1));
    state.startEpisode = 1;
    setTimeout(() => { if (String(state.id) === String(a.mal_id)) { loadRelatedSimilar(a.mal_id); loadSeasons(a.mal_id); } }, 1200);
  } catch (e) { app.innerHTML = errorBox('Could not load this anime.'); }
}
const EP_PAGE = 100;
function buildEpRange(r) {
  const c = window.currentAnime, grid = $('#epGrid'), bar = $('#epRanges');
  if (!c || !grid) return;
  const pages = Math.ceil(c.total / EP_PAGE);
  r = Math.max(0, Math.min(r, pages - 1));
  c.epRange = r;
  const from = r * EP_PAGE + 1, to = Math.min(c.total, from + EP_PAGE - 1);
  grid.innerHTML = Array.from({ length: to - from + 1 }, (_, i) => { const e = from + i, on = e === c.episode; return `<button data-ep="${e}" class="ep py-2 rounded-lg text-sm hover:bg-accent hover:text-black transition-colors ${on ? 'bg-accent text-black' : 'bg-card'}">${e}</button>`; }).join('');
  if (bar) bar.innerHTML = pages > 1 ? Array.from({ length: pages }, (_, i) => { const a = i * EP_PAGE + 1, b = Math.min(c.total, a + EP_PAGE - 1); return `<button data-eprange="${i}" class="px-3 py-1.5 rounded-full text-xs border border-white/5 ${i === r ? 'bg-accent text-black' : 'bg-card hover:bg-accent hover:text-black'}">${a}–${b}</button>`; }).join('') : '';
  const active = bar?.querySelector('.bg-accent'); if (active && active.scrollIntoView) bar.scrollLeft = active.offsetLeft - 16;
}
function playEpisode(n) {
  const current = window.currentAnime;
  if (!current) return;
  if (n > 0) { const r = Math.floor((Math.min(n, current.total) - 1) / EP_PAGE); if (r !== current.epRange || !$('#epGrid')?.childElementCount) { current.episode = Math.min(n, current.total); buildEpRange(r); } }
  else if (!$('#epGrid')?.childElementCount) buildEpRange(current.epRange || 0);
  const { id, trailer, language } = current;
  const player = $('#player');
  const label = $('#nowPlaying');
  if (!player || !label) return;

  document.querySelectorAll('.ep').forEach(b => {
    const on = +b.dataset.ep === n;
    b.classList.toggle('bg-accent', on);
    b.classList.toggle('text-black', on);
    b.classList.toggle('bg-card', !on);
  });
  document.querySelectorAll('.language').forEach(b => {
    const on = b.dataset.language === language;
    b.classList.toggle('bg-accent', on);
    b.classList.toggle('text-black', on);
    b.classList.toggle('bg-card', !on);
  });
  document.querySelectorAll('.mode').forEach(b => {
    const on = n === 0 && b.dataset.mode === 'trailer';
    b.classList.toggle('bg-accent', on);
    b.classList.toggle('text-black', on);
    b.classList.toggle('bg-card', !on);
  });

  if (n === 0 && trailer && location.protocol !== 'file:') {
    player.innerHTML = `<iframe class="w-full h-full" src="${esc(trailer)}" title="Anime trailer" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    label.textContent = 'Playing trailer. Select an episode to watch the series.';
    return;
  }

  const episode = Math.max(1, Math.min(Number(n) || 1, current.total || 200));
  current.episode = episode;
  saveContinueWatching({ id: current.id, title: current.title, image: current.image || '', episode, language });
  // `id` is the numeric AniList media ID returned by AniList GraphQL (norm() maps m.id to this field).
  // Anixo resolves the episode from AniList ID + 1-indexed episode number; no episode source ID is needed here.
  const params = new URLSearchParams({
    track: language,
    autoSkipIntro: '1',
    autoSkipOutro: '1'
  });
  const src = `${ANIXO_BASE}/embed/ani/${encodeURIComponent(id)}/${episode}?${params.toString()}`;
  player.innerHTML = `<iframe class="w-full h-full" src="${esc(src)}" title="${esc(current.title || 'Anime')} episode ${episode}" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen loading="eager"></iframe>`;
  label.textContent = `Episode ${episode} · ${language === 'dub' ? 'Dub' : 'Sub'} · Player provided by Anixo.`;
}


// Optional Anixo player events. Only accept messages from the expected embed origin.
window.addEventListener('message', (event) => {
  if (event.origin !== 'https://anixo.buzz' || !event.data || typeof event.data !== 'object') return;
  if (event.data.type === 'aniembed:play') {
    console.info('Anixo playback started at', Number(event.data.currentTime) || 0, 'seconds');
  } else if (event.data.type === 'aniembed:ended') {
    console.info('Anixo episode ended.');
    const current = window.currentAnime;
    if (current && current.episode < current.total) {
      const label = $('#nowPlaying');
      if (label) label.textContent = `Episode ${current.episode} ended. Select episode ${current.episode + 1} to continue.`;
    }
  }
});

function updateBottomNav() {
  const key = state.view === 'home' ? 'home' : (state.view === 'browse' && state.filter !== 'genre') ? state.filter : '';
  document.querySelectorAll('#bottomNav [data-key]').forEach(el => el.classList.toggle('on', el.dataset.key === key));
}
function navigate(view, opts = {}) {
  const { fromRoute, ...rest } = opts;            // fromRoute = true when the change came from the address bar/refresh
  clearInterval(state.heroTimer);
  Object.assign(state, { view, page: 1, hasNext: false, totalPages: 1, totalItems: 0 }, rest);
  updateBottomNav();
  state.startEpisode = view === 'watch' ? Math.max(1, Number(rest.startEpisode) || 1) : 1;
  if (view === 'search') { $('#searchInput').value = state.query; if (!rest.sortBy) state.sortBy = 'SEARCH_MATCH'; } else if (view === 'browse' && !rest.sortBy) state.sortBy = rest.filter === 'upcoming' ? 'POPULARITY_DESC' : 'SCORE_DESC';
  $('#mobileMenu').classList.add('hidden');
  if (!fromRoute) setHash();                      // keep the address bar in sync so refresh/back/forward work
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (view === 'home') renderHome();
  else if (view === 'watch') renderWatch(state.id);
  else if (view === 'anikoto-watch') renderAniKotoWatch(state.id);
  else renderList();
}

function routeFromState() {
  const p = state.page > 1 ? '?p=' + state.page : '';
  if (state.view === 'watch') return '#/watch/' + state.id;
  if (state.view === 'anikoto-watch') return '#/anikoto/' + state.id;
  if (state.view === 'search') return '#/search/' + encodeURIComponent(state.query) + p;
  if (state.view === 'browse') return state.filter === 'genre' ? '#/genre/' + encodeURIComponent(state.genreId) + p : '#/browse/' + state.filter + p;
  return '#/home';
}
function parseRoute() {
  const [path, qs] = location.hash.slice(1).split('?');
  const [a, b] = path.split('/').filter(Boolean);
  const page = Math.max(1, parseInt(new URLSearchParams(qs || '').get('p'), 10) || 1);
  const val = b ? decodeURIComponent(b) : '';
  if (a === 'watch' && val) return ['watch', { id: val }];
  if (a === 'anikoto' && val) return ['anikoto-watch', { id: val }];
  if (a === 'search' && val) return ['search', { query: val, page }];
  if (a === 'genre' && val) return ['browse', { filter: 'genre', genreId: val, page }];
  if (a === 'browse') return ['browse', { filter: ['top', 'movies', 'all', 'upcoming'].includes(val) ? val : 'top', page }];
  return ['home', {}];
}
function setHash() { const h = routeFromState(); if (location.hash !== h) location.hash = h; }
window.addEventListener('hashchange', () => {
  if (location.hash === routeFromState()) return;
  const [v, o] = parseRoute();
  navigate(v, { ...o, fromRoute: true });
});
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-nav],[data-watch],[data-genre],[data-page],[data-ep],[data-eprange],[data-season],[data-dot],[data-mode],[data-language],[data-anikoto-watch],[data-ak-ep],[data-ak-language],[data-resume],[data-remove-continue],[data-clear-continue],[data-reset-filters],[data-toggle-filters],[data-toggle-genres]');
  if (!t) return;
  e.preventDefault();
  if (t.hasAttribute('data-toggle-genres')) { document.querySelector('.genre-row')?.classList.toggle('open'); t.classList.toggle('open'); return; }
  if (t.hasAttribute('data-toggle-filters')) { const open = !t.classList.contains('open'); t.classList.toggle('open', open); $('#advancedFilters')?.classList.toggle('open', open); document.querySelector('.genre-row')?.classList.toggle('open', open); return; }
  if (t.dataset.watch) return navigate('watch', { id: t.dataset.watch });
  if (t.dataset.resume) return navigate('watch', { id: t.dataset.resume, startEpisode: Math.max(1, Number(t.dataset.resumeEp) || 1) });
  if (t.hasAttribute('data-remove-continue')) { try { localStorage.setItem(CONTINUE_KEY, JSON.stringify(getContinueWatching().filter(x => String(x.id) !== String(t.dataset.removeContinue)))); } catch (_) {} if (state.view === 'home') renderHome(); return; }
  if (t.hasAttribute('data-clear-continue')) { try { localStorage.removeItem(CONTINUE_KEY); } catch (_) {} if (state.view === 'home') renderHome(); return; }
  if (t.hasAttribute('data-reset-filters')) { state.sortBy = state.view === 'search' ? 'SEARCH_MATCH' : state.filter === 'upcoming' ? 'POPULARITY_DESC' : 'SCORE_DESC'; state.formatFilter = ''; state.seasonFilter = ''; state.yearFilter = ''; state.minScore = ''; state.page = 1; renderList(); return; }
  if (t.dataset.anikotoWatch) return navigate('anikoto-watch', { id: t.dataset.anikotoWatch });
  if (t.dataset.akEp !== undefined) return playAniKotoEpisode(+t.dataset.akEp);
  if (t.dataset.akLanguage) { if (window.currentAniKoto) { window.currentAniKoto.language = t.dataset.akLanguage; return playAniKotoEpisode(window.currentAniKoto.episodeIndex || 0); } }
  if (t.dataset.genre) return navigate('browse', { filter: 'genre', genreId: t.dataset.genre });
  if (t.dataset.language) { window.currentAnime.language = t.dataset.language; return playEpisode(window.currentAnime.episode || 1); }
  if (t.dataset.mode) return playEpisode(0);
  if (t.dataset.eprange !== undefined) return buildEpRange(+t.dataset.eprange);
  if (t.dataset.season) return navigate('watch', { id: t.dataset.season });
  if (t.dataset.ep) return playEpisode(+t.dataset.ep);
  if (t.dataset.dot) { showSlide(+t.dataset.dot); return startHero(), showSlide(+t.dataset.dot); }
  if (t.dataset.page) { state.page += +t.dataset.page; setHash(); window.scrollTo({ top: 0, behavior: 'smooth' }); return renderList(); }

  navigate(t.dataset.nav);
});
$('#burger').addEventListener('click', () => { const m = $('#mobileMenu'); m.classList.toggle('hidden'); m.classList.toggle('flex'); });
document.addEventListener('change', (e) => {
  if (e.target.closest('#advancedFilters')) return;
});
document.addEventListener('submit', (e) => {
  if (e.target.id === 'advancedFilters') {
    e.preventDefault(); const fd = new FormData(e.target);
    state.sortBy = String(fd.get('sortBy') || 'SCORE_DESC'); state.formatFilter = String(fd.get('formatFilter') || '');
    state.seasonFilter = String(fd.get('seasonFilter') || ''); state.yearFilter = String(fd.get('yearFilter') || '').trim();
    state.minScore = String(fd.get('minScore') || '').trim(); state.page = 1; setHash(); renderList(); return;
  }
  if (e.target.id !== 'pageJumpForm') return;
  e.preventDefault();
  const input = $('#pageJump');
  const target = Math.max(1, Math.min(state.totalPages || 1, Math.floor(Number(input.value) || 1)));
  if (target === state.page) return;
  state.page = target;
  setHash();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderList();
});
$('#searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = $('#searchInput').value.trim();
  if (q) navigate('search', { query: q });
});
const THEME_KEY = 'aniverse_theme_v1';
const THEMES = [
  { id: 'sakura', name: 'Sakura', bg: '#0a0a0a', accent: '#ffbade' },
  { id: 'ocean',  name: 'Ocean',  bg: '#0a0d14', accent: '#60a5fa' },
  { id: 'mint',   name: 'Mint',   bg: '#09100d', accent: '#34d399' },
  { id: 'sunset', name: 'Sunset', bg: '#100b08', accent: '#fb923c' },
  { id: 'violet', name: 'Violet', bg: '#0d0a14', accent: '#a78bfa' },
  { id: 'amoled', name: 'AMOLED', bg: '#000000', accent: '#22d3ee' },
  { id: 'light',  name: 'Light',  bg: '#f7f7fa', accent: '#db2777' }
];
function applyTheme(id, save) {
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  document.documentElement.setAttribute('data-theme', t.id);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t.bg;
  document.querySelectorAll('#themePanel [data-theme-id]').forEach(b => b.classList.toggle('on', b.dataset.themeId === t.id));
  if (save) { try { localStorage.setItem(THEME_KEY, t.id); } catch (_) {} }
}
{
  const panel = $('#themePanel'), btn = $('#themeBtn');
  panel.innerHTML = '<p class="theme-title">Theme</p><div class="theme-grid">' + THEMES.map(t =>
    `<button type="button" data-theme-id="${t.id}" class="theme-opt"><span class="theme-sw" style="background:linear-gradient(135deg,${t.bg} 50%,${t.accent} 50%)"></span><span>${t.name}</span></button>`).join('') + '</div>';
  const setOpen = (open) => { panel.hidden = !open; btn.setAttribute('aria-expanded', String(open)); };
  btn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(panel.hidden); });
  panel.addEventListener('click', (e) => { const o = e.target.closest('[data-theme-id]'); if (o) { applyTheme(o.dataset.themeId, true); setOpen(false); } });
  document.addEventListener('click', (e) => { if (!panel.hidden && !e.target.closest('#themePanel, #themeBtn')) setOpen(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setOpen(false); });
  let saved = null; try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
  applyTheme(saved, false);
}
{ // swipe the hero carousel on touch screens
  let sx = 0, sy = 0;
  document.addEventListener('touchstart', (e) => { if (!e.target.closest('#hero')) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!e.target.closest('#hero')) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { const next = state.heroIndex + (dx < 0 ? 1 : -1); startHero(); showSlide(next); }
  }, { passive: true });
}
{ const [v, o] = parseRoute(); navigate(v, { ...o, fromRoute: true }); }
</script>
